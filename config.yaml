# Microsite Annotation Flywheel configuration.
#
# One round is one edit here, not a code change. Change `round` and the paths follow.
# The Roboflow API key is NOT here: it lives in a gitignored .env as ROBOFLOW_API_KEY.

round: 1

# Roboflow workspace and the two projects of the loop.
workspace: gregory-paradis-ubc-ca
train_project: a58-sandbox        # images whose annotations train the pre-labeller
prelabel_project: a58-sandbox     # images that receive pre-labels
prelabel_class: a58-sandbox-microsite

# Local round outputs (gitignored). In production point this at the DataLad data repository.
data_root: _data
state_path: loop_state.json

model:
  encoder: resnet34
  epochs: 60
  batch_size: 8
  learning_rate: 0.0003
  patience: 12
  image_size: 1024

prelabel:
  threshold: 0.5
  min_polygon_area: 64
  tta: true
  limit: 0
  split: train
